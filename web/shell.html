<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <meta name="description" content="Play DEAD SIGNAL: three sectors, six weapons, one way out. A classic Redot-powered shooter, right in your browser.">
  <title>DEAD SIGNAL — Play in your browser</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; --orange: #ff3b0a; --muted: #aaaab4; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    body { color: #fff; font: 15px/1.5 system-ui, sans-serif; }
    [hidden] { display: none !important; }
    .eyebrow { color: var(--orange); font: 12px/1.4 ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; }
    a { color: var(--muted); text-underline-offset: 4px; }
    a:hover { color: white; }
    button { font: inherit; font-weight: 650; cursor: pointer; background: #19191d; color: white; border: 1px solid #303036; padding: 9px 16px; border-radius: 4px; }
    button:hover { border-color: var(--orange); }
    button:disabled { cursor: wait; opacity: .6; }
    :focus-visible { outline: 2px solid var(--orange); outline-offset: 4px; }
    .primary { background: var(--orange); color: #09090b; border-color: var(--orange); padding: 12px 28px; }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; border: 0; image-rendering: pixelated; outline: none; touch-action: none; }
    #overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; overflow: auto; background: radial-gradient(ellipse at 50% 130%, #42170e, transparent 65%), #0b0b0e; text-align: center; }
    .launch { max-width: 520px; }
    h1 { font-size: clamp(36px, 7vw, 76px); letter-spacing: -.065em; line-height: 1; margin: 16px 0; }
    .tagline { color: var(--muted); margin: 0 0 26px; }
    #progress { display: block; accent-color: var(--orange); width: min(280px, 100%); height: 6px; margin: 22px auto 10px; }
    #status { font-size: 13px; color: var(--muted); min-height: 20px; margin: 14px 0 0; }
    #utilities { position: absolute; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 16px; padding: 6px 10px; border-radius: 4px; background: #09090bcc; font-size: 12px; }
    #utilities button { padding: 5px 10px; font-size: 12px; }
    .screen-reader-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    @media (max-width: 600px) { h1 { font-size: 36px; } .tagline { margin-bottom: 16px; font-size: 13px; } .eyebrow { font-size: 10px; } #overlay { padding: 16px; } #status { font-size: 12px; } }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <main id="stage" aria-label="DEAD SIGNAL game">
      <canvas id="canvas" width="480" height="270" tabindex="0" aria-label="Game. Use WASD to move, mouse to aim, click to fire, P to pause.">A WebGL 2 browser is required.</canvas>
      <div id="overlay">
        <div class="launch">
          <div class="eyebrow">Facility 09 / Loading</div>
          <h1>DEAD SIGNAL</h1>
          <p class="tagline">Three sectors. Six weapons. One way out.</p>
          <progress id="progress" aria-label="Downloading game"></progress>
          <p id="status" role="status" aria-live="polite">Loading the facility…</p>
          <button class="primary" id="retry" type="button" hidden>Reload &amp; retry</button>
          <noscript>Enable JavaScript to play DEAD SIGNAL.</noscript>
        </div>
      </div>
    <nav id="utilities" aria-label="Game utilities">
      <a href="/credits.html" target="_blank" rel="noopener noreferrer">Credits</a>
      <a href="https://github.com/OpenStaticFish/redot-doom" target="_blank" rel="noopener noreferrer">Source</a>
      <button id="fullscreen" type="button">Fullscreen</button>
    </nav>
    <span id="session" class="screen-reader-only" role="status">Desktop browser / WebGL 2</span>
  </main>
  <script src="$GODOT_URL"></script>
  <script>
    (() => {
      const canvas = document.getElementById('canvas');
      const stage = document.getElementById('stage');
      const retry = document.getElementById('retry');
      const progress = document.getElementById('progress');
      const status = document.getElementById('status');
      const session = document.getElementById('session');
      const utilities = document.getElementById('utilities');
      let pauseGame = () => {};
      let persistent = true;
      window.deadSignal = {
        registerPause(callback) { pauseGame = callback; },
        setPersistent(value) { persistent = value; },
        setState(state) {
          document.documentElement.dataset.gameState = state;
          utilities.hidden = state === 'playing';
          session.textContent = state === 'playing' ? 'Signal connected / P or Esc to pause' :
            (persistent ? 'Enter or click to select / saves stay in this browser' : 'Storage unavailable / saves last only for this session');
        }
      };
      const engine = new Engine($GODOT_CONFIG);
      function failure(error) {
        document.documentElement.dataset.boot = 'error';
        document.getElementById('overlay').hidden = false;
        utilities.hidden = false;
        status.textContent = error instanceof Error ? error.message : String(error);
        progress.hidden = true;
        retry.hidden = false;
      }
      async function startGame() {
        document.documentElement.dataset.boot = 'loading';
        const missing = Engine.getMissingFeatures({ threads: false });
        if (missing.length) { failure('This browser needs: ' + missing.join(', ') + '. Try a current desktop browser with hardware acceleration.'); return; }
        progress.hidden = false;
        status.textContent = 'Downloading the signal…';
        performance.mark('game-start');
        try {
          await engine.startGame({
            canvas,
            onProgress(current, total) {
              if (total > 0) { progress.max = total; progress.value = current; }
              else progress.removeAttribute('value');
              status.textContent = total > 0 ? 'Downloading… ' + Math.round(current / total * 100) + '%' : 'Initializing the facility…';
            },
            onExit() { failure('Session ended. Reload to reconnect.'); }
          });
          document.getElementById('overlay').hidden = true;
          document.documentElement.dataset.boot = 'ready';
          performance.mark('game-ready');
          performance.measure('game-boot', 'game-start', 'game-ready');
          canvas.focus({ preventScroll: true });
        } catch (error) { failure(error); }
      }
      retry.onclick = () => window.location.reload();
      document.getElementById('fullscreen').onclick = async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await stage.requestFullscreen();
          canvas.focus({ preventScroll: true });
        } catch { session.textContent = 'Fullscreen is unavailable in this browser.'; }
      };
      document.addEventListener('fullscreenchange', () => {
        document.getElementById('fullscreen').textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
      });
      document.addEventListener('pointerlockchange', () => {
        if (!document.pointerLockElement) pauseGame();
      });
      document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
      window.addEventListener('blur', () => pauseGame());
      canvas.addEventListener('contextmenu', event => event.preventDefault());
      canvas.addEventListener('keydown', event => {
        if (['Tab', 'F5', 'F9', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.code) ||
            (event.ctrlKey && ['KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(event.code))) event.preventDefault();
      });
      startGame();
    })();
  </script>
</body>
</html>
